server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Service Worker: no cache, permitir scope en la raíz
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires 0;
    }

    # Workbox runtime SW (nombre generado por vite-plugin-pwa)
    location ~* /workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Web App Manifest
    location ~* \.(webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    # Íconos PWA: cache largo (tienen nombre fijo)
    location /icons/ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Assets con hash de Vite: cache inmutable
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: todas las rutas desconocidas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 30m;

        proxy_pass http://server:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
