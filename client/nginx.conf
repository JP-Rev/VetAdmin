server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # Regla de oro del cacheo: solo es "immutable" lo que tiene hash en el
    # nombre. Todo lo de nombre fijo (index.html, sw.js, registerSW.js, el
    # manifest) tiene que revalidarse en cada carga, o el navegador sigue
    # sirviendo la version vieja despues de un deploy.
    # ---------------------------------------------------------------------

    # Assets con hash de Vite (/assets/index-a1b2c3.js): el nombre cambia en
    # cada build, asi que se pueden cachear para siempre sin riesgo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Iconos PWA: nombre fijo, cambian muy poco. Una semana, pero revalidando
    # (sin immutable, que impediria refrescarlos si se cambia el logo).
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Service Worker: nunca cachear. Es lo que detecta que hay version nueva;
    # si queda cacheado, la actualizacion no llega nunca.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Runtime de Workbox: lo pide el SW, que revalide.
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    # SPA: cualquier ruta desconocida sirve index.html.
    # index.html NO se cachea: es el que referencia los bundles con hash, asi
    # que si queda viejo el navegador sigue pidiendo los bundles viejos aunque
    # los nuevos ya esten en el servidor. Esta era la causa de que hubiera que
    # hacer Ctrl+Shift+R despues de cada deploy.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 30m;

        proxy_pass http://server:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
