<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VetAdmin</title>

    <!-- PWA meta tags (manifest + SW injected by vite-plugin-pwa at build time) -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VetAdmin" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    
    <!-- Google Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'Helvetica', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              // "surface" is the card/panel background (replaces bare bg-white),
              // themable via CSS vars so it flips with the .dark class.
              surface: 'rgb(var(--color-surface) / <alpha-value>)',
              // "chrome" is the structural nav background (sidebar / header bar),
              // separate from "primary" so buttons/links can stay vividly teal in
              // both themes while the sidebar/header go near-black in dark mode.
              chrome: {
                DEFAULT: 'rgb(var(--color-chrome) / <alpha-value>)',
                header: 'rgb(var(--color-chrome-header) / <alpha-value>)',
              },
              primary: { // Turquoise. 50-200 are themable (used as soft badge/alert backgrounds).
                50: 'rgb(var(--color-primary-50) / <alpha-value>)',
                100: 'rgb(var(--color-primary-100) / <alpha-value>)',
                200: 'rgb(var(--color-primary-200) / <alpha-value>)',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488', // Main primary
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#062f2b',
              },
              secondary: { // Neutral Gray/Blue. Fully themable: the whole ramp flips in dark mode.
                50: 'rgb(var(--color-secondary-50) / <alpha-value>)',
                100: 'rgb(var(--color-secondary-100) / <alpha-value>)',
                200: 'rgb(var(--color-secondary-200) / <alpha-value>)',
                300: 'rgb(var(--color-secondary-300) / <alpha-value>)',
                400: 'rgb(var(--color-secondary-400) / <alpha-value>)',
                500: 'rgb(var(--color-secondary-500) / <alpha-value>)',
                600: 'rgb(var(--color-secondary-600) / <alpha-value>)',
                700: 'rgb(var(--color-secondary-700) / <alpha-value>)',
                800: 'rgb(var(--color-secondary-800) / <alpha-value>)',
                900: 'rgb(var(--color-secondary-900) / <alpha-value>)',
                950: 'rgb(var(--color-secondary-950) / <alpha-value>)',
              },
              accent: { // Yellow/Amber
                50: 'rgb(var(--color-accent-50) / <alpha-value>)',
                100: 'rgb(var(--color-accent-100) / <alpha-value>)',
                200: 'rgb(var(--color-accent-200) / <alpha-value>)',
                300: '#fcd34d',
                400: '#fbbf24',
                500: '#f59e0b', // amber-500
                600: '#d97706', // amber-600
                700: '#b45309',
                800: '#92400e',
                900: '#78350f',
                950: '#451a03',
              },
              error: { // Red
                50: 'rgb(var(--color-error-50) / <alpha-value>)',
                100: 'rgb(var(--color-error-100) / <alpha-value>)',
                200: 'rgb(var(--color-error-200) / <alpha-value>)',
                300: '#fca5a5',
                400: '#f87171',
                500: '#ef4444', // red-500
                600: '#dc2626', // red-600
                700: '#b91c1c',
                800: '#991b1b',
                900: '#7f1d1d',
                950: '#450a0a',
              },
              success: { // Green
                50: 'rgb(var(--color-success-50) / <alpha-value>)',
                100: 'rgb(var(--color-success-100) / <alpha-value>)',
                200: 'rgb(var(--color-success-200) / <alpha-value>)',
                300: '#86efac',
                400: '#4ade80',
                500: '#22c55e', // green-500
                600: '#16a34a', // green-600
                700: '#15803d',
                800: '#166534',
                900: '#14532d',
                950: '#052e16',
              },
              warning: { // Orange for warnings (like low stock, distinct from error red)
                50: 'rgb(var(--color-warning-50) / <alpha-value>)',
                100: 'rgb(var(--color-warning-100) / <alpha-value>)',
                200: 'rgb(var(--color-warning-200) / <alpha-value>)',
                300: '#fdba74',
                400: '#fb923c',
                500: '#f97316', // orange-500
                600: '#ea580c', // orange-600
                700: '#c2410c',
                800: '#9a3412',
                900: '#7c2d12',
                950: '#431407',
              }
            }
          }
        }
      }
    </script>
    
    <style>
      body {
        font-family: 'Manrope', Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbar for webkit browsers */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; /* Light gray track */
      }
      ::-webkit-scrollbar-thumb {
        background: #0d9488; /* Primary color thumb */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0f766e; /* Darker primary on hover */
      }
      /* For Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #0d9488 #f1f1f1; /* thumb track */
      }

      /* Print specific styles for PDF generation and browser print */
      #print-root { 
        display: none; /* Hidden by default */
      }
      
      .printable-area {
        width: 210mm; /* A4 width */
        min-height: 297mm; /* A4 height */
        margin: 0 auto; /* Center horizontally */
        padding: 20mm; /* A4 margins */
        font-size: 11pt;
        line-height: 1.4;
        color: #000 !important;
        background-color: #fff !important;
        box-sizing: border-box;
        font-family: 'Inter', Arial, sans-serif;
        position: relative;
        left: 0; /* Reset any left positioning */
        right: 0; /* Reset any right positioning */
      }
      .printable-area * {
          color: #000 !important;
          background-color: transparent !important;
          box-shadow: none !important;
      }
      .printable-area .no-print {
          display: none !important;
      }
      .printable-area h1 {
        font-size: 18pt;
        font-weight: bold;
        margin-bottom: 8pt;
        text-align: center;
      }
      .printable-area h2 {
        font-size: 16pt;
        font-weight: bold;
        margin-bottom: 6pt;
        text-align: center;
      }
      .printable-area h3 {
        font-size: 14pt;
        font-weight: bold;
        margin-bottom: 4pt;
        margin-top: 12pt;
      }
      .printable-area p {
        margin-bottom: 4pt;
      }
      .printable-area section {
        margin-bottom: 16pt;
        padding: 8pt;
        border: 1pt solid #ccc;
        border-radius: 4pt;
      }
      .printable-area .event-item {
        padding-bottom: 8pt;
        margin-bottom: 8pt;
        border-bottom: 1pt solid #ddd;
      }
      .printable-area .event-item:last-child {
        border-bottom: none;
      }
      
      /* Styles for when body.printing is active (used by html2canvas) */
      body.printing #print-root {
        display: block !important; /* Make it visible for html2canvas */
        position: fixed !important; /* Position it off-screen */
        left: 0 !important; /* Center it properly */
        top: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 9999 !important; /* Bring to front for capture */
        background: white !important; /* Ensure canvas background is white */
        overflow: visible !important;
      }
      body.printing #root {
        display: none !important; /* Hide main app during capture */
      }
      body.printing .printable-area {
        position: relative !important;
        left: 0 !important;
        top: 0 !important;
        margin: 0 auto !important;
        transform: none !important;
      }

      @media print {
        body > #root {
          display: none !important; 
        }
        #print-root {
          display: block !important; 
        }
        .printable-area {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 0 auto;
            box-sizing: border-box;
            position: relative;
            left: 0;
            right: 0;
        }
        .printable-area table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 0.5em;
          margin-bottom: 0.5em;
        }
        .printable-area th, .printable-area td {
          border: 1px solid #ccc; 
          padding: 4px;
          text-align: left;
        }
        .printable-area h1, .printable-area h2, .printable-area h3, .printable-area h4, .printable-area p {
          margin-bottom: 0.3em;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.6.2",
    "lucide-react": "https://esm.sh/lucide-react@^0.400.0",
    "react-dom": "https://esm.sh/react-dom@^19.1.0",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
    "jspdf": "https://esm.sh/jspdf@^3.0.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-secondary-100 text-secondary-900"> <!-- Adjusted body bg and text for overall theme -->
    <div id="print-root"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
