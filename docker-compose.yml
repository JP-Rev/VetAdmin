services:
  server:
    build:
      context: ./server
    container_name: vetadmin_server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: file:/data/vetadmin.db
      STORAGE_ROOT: /srv/storage/vetadmin
      # 🔴 Sin esto el contenedor corre en UTC y los recordatorios de turno
      # salen 3 horas corridos: el turno guarda la hora como texto y el
      # instante real se arma con el huso del proceso.
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      # Los archivos subidos van SIEMPRE bajo /srv/storage/ en el VPS: el backup
      # automatico del servidor recorre ese arbol. Lo que quede afuera no se
      # respalda. Ver vps/backups.md en Infra-Notes-VPS-Hostinger.
      - ${STORAGE_ROOT_HOST:-/srv/storage/vetadmin}:/srv/storage/vetadmin
      # TODO: la base tambien deberia estar bajo /srv/storage/vetadmin/database/
      # en vez de este volumen Docker nombrado -- hoy es la unica de las 3 apps
      # del VPS que no sigue esa convencion, y por eso el script de backup tiene
      # que listarla a mano en vez de descubrirla sola. Migrarla requiere parar
      # el stack y copiar el archivo (ver vps/backups.md seccion 7).
      - sqlite_data:/data
    # Sin `ports`: la API no se publica al host. El cliente la alcanza por la
    # red interna (nginx hace proxy_pass a http://server:4000), asi que exponerla
    # afuera solo agregaria una puerta accesible por IP directa, salteando el
    # proxy. Para depurar desde el VPS: `docker compose exec server ...` o
    # `docker compose run --rm --service-ports server`.
    networks:
      - vetadmin_net
      # Red compartida con el relay SMTP (/srv/docker/mail): el mailer le habla
      # contenedor a contenedor, host "mail", puerto 25. Sin esto la
      # recuperacion de contraseña por mail no puede salir.
      # Ver infra-notes-vps-hostinger/vps/mail.md.
      - mail_net
      # Red compartida con Evolution API (/srv/docker/evolution), que mantiene
      # la sesión de WhatsApp desde la que salen los recordatorios de turno.
      # Mismo criterio que mail_net: servicio aparte, no embebido acá.
      # Ver vps/evolution.md en el repo infra-notes-vps-hostinger.
      - evolution_net

  client:
    build:
      context: ./client
    container_name: vetadmin_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Atado a 127.0.0.1: solo entra trafico por el proxy del host, no por la
      # IP publica del VPS. Misma convencion que facturacion-web y kinetic.
      - "127.0.0.1:${CLIENT_PORT:-3008}:80"
    networks:
      - vetadmin_net

volumes:
  sqlite_data:

networks:
  vetadmin_net:
    driver: bridge
  # Creada a mano una sola vez en el VPS: docker network create mail_net
  # (external: no la administra este compose, la comparten las tres apps).
  mail_net:
    external: true
  # Creada a mano una sola vez en el VPS: docker network create evolution_net
  evolution_net:
    external: true
